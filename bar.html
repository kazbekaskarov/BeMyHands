<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>Qolda</title>
  <style>
    :root {
      --bg:#11141b; --bg-2:#1c2230;
      --fg:#e7eaf1; --fg-2:#aab2c5; --fg-3:#6e7891;
      --border:#232a3a; --accent:#6366f1;
      --ok:#22c55e; --warn:#f59e0b; --err:#ef4444;
    }
    html, body { margin:0; padding:0; height:100%; overflow:hidden; }
    body {
      font: 11.5px/1 -apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Text', system-ui, sans-serif;
      color: var(--fg); background: var(--bg);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.45);
      display: flex; align-items: center; gap: 10px; padding: 0 10px;
      -webkit-app-region: drag; user-select: none; cursor: default;
    }
    .brand { display: flex; align-items: center; gap: 8px; padding-right: 8px; border-right: 1px solid var(--border); height: 18px; }
    .brand-mark { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); display: grid; place-items: center; color: #fff; }
    .brand-name { font-weight: 600; font-size: 11px; letter-spacing: -0.01em; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--fg-3); flex-shrink: 0; transition: background .2s, box-shadow .2s; }
    .dot.ok   { background: var(--ok);   box-shadow: 0 0 6px rgba(34,197,94,.55); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 5px rgba(245,158,11,.45); }
    .dot.err  { background: var(--err);  box-shadow: 0 0 6px rgba(239,68,68,.55); }
    #text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); font-size: 11.5px; }
    .badge { padding: 2px 7px; border-radius: 4px; background: var(--bg-2); color: var(--fg-2); font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; -webkit-app-region: no-drag; flex-shrink: 0; }
    .badge:empty { display: none; }
    .badge.scroll { background: var(--warn); color: #000; }
    .badge.drag   { background: var(--err);  color: #fff; }
    .badge.paused { background: var(--fg-3); color: #fff; }
    .actions { display: flex; align-items: center; gap: 2px; }
    button {
      -webkit-app-region: no-drag;
      background: transparent; color: var(--fg-3); border: none;
      padding: 4px 6px; border-radius: 4px; font-size: 12px; cursor: pointer; line-height: 1;
      transition: background .12s, color .12s;
      display: inline-flex; align-items: center; justify-content: center;
    }
    button:hover { background: var(--bg-2); color: var(--fg); }
    button#quit:hover { background: rgba(239,68,68,.2); color: var(--err); }
    svg { display: block; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" width="11" height="11"><path fill="currentColor" d="M9 2.5a1.5 1.5 0 013 0V11h.5V4a1.5 1.5 0 013 0v7h.5V6.5a1.5 1.5 0 013 0V14a7 7 0 11-14 0V8a1.5 1.5 0 013 0V11H9V2.5z"/></svg>
    </div>
    <span class="brand-name">Qolda</span>
  </div>
  <span class="dot" id="dot"></span>
  <span id="text">Готов</span>
  <span class="badge" id="badge"></span>
  <div class="actions">
    <button id="open" title="Открыть настройки">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </button>
    <button id="quit" title="Закрыть приложение">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <script>
    const dot = document.getElementById('dot');
    const textEl = document.getElementById('text');
    const badge = document.getElementById('badge');
    document.getElementById('open').addEventListener('click', () => window.bar.showMain());
    document.body.addEventListener('dblclick', () => window.bar.showMain());
    document.getElementById('quit').addEventListener('click', () => window.bar.quit());
    window.bar.onStatus((s) => {
      textEl.textContent = s.text || 'Qolda';
      dot.className = 'dot ' + (s.dot || '');
      badge.className = 'badge ' + (s.mode || '');
      badge.textContent = s.modeText || '';
    });
  </script>
</body>
</html>
