<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
  <title>BeMyHands</title>
  <style>
    :root {
      --bg: #0d1220;
      --fg: #f1f4fb;
      --muted: #b9c2d6;
      --accent: #7c5cff;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    html, body {
      margin: 0; padding: 0; height: 100%; overflow: hidden;
      font: 11px -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
      color: var(--fg);
      background: linear-gradient(135deg, #11172b 0%, #0a0e1a 100%);
      border-radius: 10px;
    }
    body {
      display: flex; align-items: center; gap: 8px; padding: 0 10px;
      border: 1px solid rgba(124, 92, 255, 0.4);
      box-shadow: 0 4px 16px rgba(0,0,0,.4), 0 0 0 1px rgba(0,0,0,.2);
      -webkit-app-region: drag;
      user-select: none; cursor: default;
      border-radius: 10px;
    }
    body:hover { background: linear-gradient(135deg, #161e38 0%, #0d1220 100%); }

    .brand {
      display: flex; align-items: center; gap: 5px;
      font-weight: 700; font-size: 11px;
    }
    .brand-mark {
      width: 16px; height: 16px; border-radius: 4px;
      background: linear-gradient(135deg, var(--accent) 0%, #14b8a6 100%);
      display: grid; place-items: center; font-size: 10px;
    }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #6b7280; flex-shrink: 0;
      transition: background .25s, box-shadow .25s;
    }
    .dot.ok   { background: var(--ok);   box-shadow: 0 0 6px rgba(34,197,94,.7); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 4px rgba(245,158,11,.5); }
    .dot.err  { background: var(--err);  box-shadow: 0 0 6px rgba(239,68,68,.7); }

    #text {
      flex: 1; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; font-size: 11px; color: var(--muted);
    }

    .badge {
      padding: 2px 6px; border-radius: 6px;
      background: rgba(255,255,255,.08); font-size: 9px; font-weight: 600;
      letter-spacing: .04em; text-transform: uppercase;
      -webkit-app-region: no-drag; flex-shrink: 0;
    }
    .badge:empty { display: none; }
    .badge.scroll { background: var(--warn); color: #000; }
    .badge.drag   { background: var(--err);  color: #fff; }
    .badge.paused { background: #6b7280; color: #fff; }

    button {
      -webkit-app-region: no-drag;
      background: transparent;
      color: var(--muted); border: none;
      padding: 4px 6px; border-radius: 5px;
      font-size: 12px; cursor: pointer; flex-shrink: 0;
      line-height: 1;
      transition: background .15s, color .15s;
    }
    button:hover { background: rgba(124,92,255,.2); color: #fff; }
    #quit:hover { background: rgba(239,68,68,.25); color: #fff; }
  </style>
</head>
<body>
  <div class="brand">
    <div class="brand-mark">✋</div>
  </div>
  <span class="dot" id="dot"></span>
  <span id="text">BeMyHands</span>
  <span class="badge" id="badge"></span>
  <button id="open" title="Открыть настройки">⚙</button>
  <button id="quit" title="Закрыть приложение">✕</button>
  <script>
    const dot = document.getElementById('dot');
    const textEl = document.getElementById('text');
    const badge = document.getElementById('badge');
    document.getElementById('open').addEventListener('click', () => window.bar.showMain());
    document.body.addEventListener('dblclick', () => window.bar.showMain());
    document.getElementById('quit').addEventListener('click', () => window.bar.quit());
    window.bar.onStatus((s) => {
      textEl.textContent = s.text || 'BeMyHands';
      dot.className = 'dot ' + (s.dot || '');
      badge.className = 'badge ' + (s.mode || '');
      badge.textContent = s.modeText || '';
    });
  </script>
</body>
</html>
